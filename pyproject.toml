[project]
name = "lpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noel Schwabenland", email = "noel@schwabenland.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "notebook>=7.6.3",
]

[project.scripts]
lpc = "lpc:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
